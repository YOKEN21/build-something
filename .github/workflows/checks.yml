name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: secret-free checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Assessor and live API evaluation are pending
        run: |
          echo "PENDING: the release-risk assessor is not implemented in this foundation."
          echo "PENDING: live API evaluation has not been run."
          echo "PENDING: risk-assessment.yml is not in this foundation."
          set +e
          npm run eval
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "npm run eval exited 0. Pending evaluation must stay incomplete."
            exit 1
          fi
          echo "PENDING: npm run eval exited ${status}. Live API evaluation remains incomplete."
